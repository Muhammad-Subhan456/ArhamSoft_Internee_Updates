<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notes API Tester</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: #f4f6f8;
      }

      .card {
        margin-top: 20px;
      }

      textarea {
        resize: none;
      }

      .note {
        border-left: 5px solid #0d6efd;
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <div class="container py-4">
      <h2 class="text-center mb-4">Notes API Tester</h2>

      <div class="row">
        <div class="col-md-6">
          <div class="card">
            <div class="card-header">Register</div>

            <div class="card-body">
              <input
                id="reg_username"
                class="form-control mb-2"
                placeholder="Username"
              />

              <input
                id="reg_email"
                class="form-control mb-2"
                placeholder="Email"
              />

              <input
                type="password"
                id="reg_password"
                class="form-control mb-2"
                placeholder="Password"
              />

              <button class="btn btn-success w-100" onclick="register()">
                Register
              </button>
            </div>
          </div>

          <div class="card">
            <div class="card-header">Login</div>

            <div class="card-body">
              <input
                id="login_email"
                class="form-control mb-2"
                placeholder="Email"
              />

              <input
                type="password"
                id="login_password"
                class="form-control mb-2"
                placeholder="Password"
              />

              <button class="btn btn-primary w-100" onclick="login()">
                Login
              </button>
            </div>
          </div>
        </div>

        <div class="col-md-6">
          <div class="card">
            <div class="card-header">Create Note</div>

            <div class="card-body">
              <input id="title" class="form-control mb-2" placeholder="Title" />

              <textarea
                id="body"
                rows="4"
                class="form-control mb-2"
                placeholder="Body"
              ></textarea>

              <input
                id="category"
                class="form-control mb-2"
                placeholder="Category ID (optional)"
              />

              <button class="btn btn-dark w-100" onclick="createNote()">
                Create Note
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-header d-flex justify-content-between">
          <span>My Notes</span>

          <div>
            <button class="btn btn-primary btn-sm" onclick="loadNotes()">
              Refresh
            </button>

            <button class="btn btn-danger btn-sm" onclick="logout()">
              Logout
            </button>
          </div>
        </div>

        <div id="notes" class="card-body"></div>
      </div>
    </div>

    <script>
      const API = "http://127.0.0.1:8000/api/v1";

      function token() {
        return localStorage.getItem("token");
      }

      async function register() {
        const response = await fetch(API + "/auth/register", {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
          },

          body: JSON.stringify({
            username: reg_username.value,

            email: reg_email.value,

            password: reg_password.value,
          }),
        });

        alert(await response.text());
      }

      async function login() {
        const response = await fetch(API + "/auth/login", {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
          },

          body: JSON.stringify({
            email: login_email.value,

            password: login_password.value,
          }),
        });

        const data = await response.json();

        if (data.access_token) {
          localStorage.setItem(
            "token",

            data.access_token,
          );

          alert("Login Successful!");
        } else {
          alert(JSON.stringify(data));
        }
      }

    async function loadNotes(){

    const response = await fetch(API + "/notes", {
        headers:{
            Authorization:"Bearer " + token()
        }
    });

    const notes = await response.json();

    let html = "";

    notes.forEach(note=>{

        html += `
        <div class="card note mb-3">

            <div class="card-body">

                <h5>${note.title}</h5>

                <p>${note.body}</p>

                <p>

                    <strong>Category:</strong>

                    ${note.category ? note.category.name : "None"}

                </p>

                <button
                    class="btn btn-warning btn-sm"
                    onclick="editNote(${note.id},
                    '${note.title.replace(/'/g,"\\'")}',
                    '${note.body.replace(/'/g,"\\'")}')">

                    Edit

                </button>

                <button
                    class="btn btn-danger btn-sm"

                    onclick="deleteNote(${note.id})">

                    Delete

                </button>

            </div>

        </div>
        `;

    });

    document.getElementById("notes").innerHTML = html;

}


      async function deleteNote(id) {
        await fetch(API + "/notes/" + id, {
          method: "DELETE",

          headers: {
            Authorization: "Bearer " + token(),
          },
        });

        loadNotes();
      }

      function logout() {
        localStorage.removeItem("token");

        alert("Logged out");
      }

      async function editNote(id, title, body){

    const newTitle = prompt("Title", title);

    if(newTitle === null) return;

    const newBody = prompt("Body", body);

    if(newBody === null) return;

    const response = await fetch(API + "/notes/" + id,{

        method:"PUT",

        headers:{
            "Content-Type":"application/json",
            Authorization:"Bearer " + token()
        },

        body:JSON.stringify({

            title:newTitle,

            body:newBody,

            category_id:null

        })

    });

    if(response.ok){

        alert("Note updated successfully");

        loadNotes();

    }

    else{

        alert(await response.text());

    }

}
    
    </script>
  </body>
</html>
